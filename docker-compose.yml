version: '3.8'

networks:
  microservice-network:
    driver: bridge

volumes:
  cassandra_data:
  es_data:
  mysql_data:

services:
  
  cassandra-db:
    image: cassandra:latest
    container_name: cassandra-db
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=Test Cluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - microservice-network
    restart: always

  cassandra-web:
    image: ipushc/cassandra-web:latest
    container_name: cassandra-web
    ports:
      - "3000:8083"
    environment:
      - CASSANDRA_HOST=cassandra-db
      - CASSANDRA_PORT=9042
    depends_on:
      - cassandra-db
    networks:
      - microservice-network
    restart: always

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - microservice-network
    restart: always

  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=ticket_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - microservice-network
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - microservice-network
    restart: always

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - microservice-network
    restart: always

  # ==============================================================================
  # Platform & Infrastructure Microservices
  # ==============================================================================
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - microservice-network
    restart: always

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8500:8500"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
    depends_on:
      - config-server
    networks:
      - microservice-network
    restart: always

  admin-server:
    build: ./admin-server
    container_name: admin-server
    ports:
      - "8095:8095"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8500/eureka/
      - ZIPKIN_URL=http://zipkin:9411
    depends_on:
      - eureka-server
    networks:
      - microservice-network
    restart: always

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8500/eureka/
      - ZIPKIN_URL=http://zipkin:9411
    depends_on:
      - eureka-server
    networks:
      - microservice-network
    restart: always

  # ==============================================================================
  # Business Microservices
  # ==============================================================================
  account-service:
    build: ./account-service
    container_name: account-service
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8500/eureka/
      - ZIPKIN_URL=http://zipkin:9411
      - CASSANDRA_CONTACT_POINTS=cassandra-db
    depends_on:
      - cassandra-db
      - eureka-server
    networks:
      - microservice-network
    restart: always

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "8085:8085"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8500/eureka/
      - ZIPKIN_URL=http://zipkin:9411
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ticket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - mysql-db
      - elasticsearch
      - rabbitmq
      - eureka-server
    networks:
      - microservice-network
    restart: always

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8888
      - EUREKA_SERVER_URL=http://eureka-server:8500/eureka/
      - ZIPKIN_URL=http://zipkin:9411
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
      - eureka-server
    networks:
      - microservice-network
    restart: always